<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="balatro.js"></script>
</head>
<body>
    <div class="loginbox" style="position: absolute; top: 30%; left: 100px; width: 600px">
        <h2 style="position: absolute; top: 5%;">Login De Usuário</h2> <br><br><br>
        <label for="email">Email:</label><br>
        <input type="email" name="Email" id="email" class="inputplace" style="position: absolute; width: 380px; font-size: 100%;"> <br><br><br>
        <label for="senha">Senha:</label><br>
        <input type="password" name="Senha" id="senha" class="inputplace" style="position: absolute; width: 380px; font-size: 100%;"><br><br><br>
        <button style="font-family: Comic Sans MS;" class="button" onclick="iniciarLogin()">Entrar</button>
    </div>   
</body>
</html>
