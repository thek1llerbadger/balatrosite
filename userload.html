<head>
    <link data-default-icon="https://cdn2.steamgriddb.com/icon/066e25a0712b306a9b95230f6ec4a051/32/256x256.png" rel="icon" sizes="192x192" href="https://cdn2.steamgriddb.com/icon/066e25a0712b306a9b95230f6ec4a051/32/256x256.png">

<body>
    <div class="header">
        <a href="#default" class="logo">CompanyLogo</a>

          <a href="userload.html">Login</a>
          <a href="userregister.html">Register</a>

    <div class="loginbox" style="position: absolute; top: 30%; left: 100px; width: 600px">
        <h2 style="position: absolute; top: 5%;">Login De Usuário</h2> <br><br><br>
        <label for="email">Email:</label><br>
        <input type="email" name="Email" id="email" class="inputplace" style="position: absolute; width: 500px; font-size: 100%;"> <br><br><br>
        <label for="senha">Senha:</label><br>
        <input type="password" name="Senha" id="senha" class="inputplace" style="position: absolute; width: 500px; font-size: 100%;"><br><br>
        <p id="incorreto" style="margin-top: 5px; margin-bottom: 23px;"></p>
        <button type="submit" style="font-family: Comic Sans MS; margin-top: 10px;" class="button" onclick="login()">Entrar</button>
        <Button class="Button" style="margin-left: 10px;"><a href="userregister.html" style="color: aqua; margin-bottom: auto; font-family: Comic Sans MS;">Não tem uma conta? Registre-se!</a></Button>
    </div>
